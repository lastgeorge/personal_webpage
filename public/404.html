<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function() {
        var basePath = '/xqian';
        var path = window.location.pathname;

        if (path.indexOf(basePath + '/') === 0 || path === basePath) {
          var restoredUrl = path + window.location.search + window.location.hash;
          sessionStorage.setItem('spa-redirect', restoredUrl);
          window.location.replace(basePath + '/');
        } else {
          window.location.replace(basePath + '/');
        }
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
